[package]
name = "rescyo-fs"
description = "Shared recovery model for Rescyo file-system engines: volume candidates, entries, extents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
encoding_rs = "0.8.42"
rescyo-codec = { workspace = true }
rescyo-io = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.153"
thiserror = "2.0.21"

[dev-dependencies]
rescyo-io = { workspace = true, features = ["testing"] }
