[package]
name = "rescyo-core"
description = "Rescyo core: sessions, scans, recovery and reports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
rescyo-fat = { workspace = true }
rescyo-fs = { workspace = true }
rescyo-io = { workspace = true }
rescyo-ntfs = { workspace = true }
rescyo-part = { workspace = true }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
thiserror = "2.0.21"
unicode-normalization = "0.1.25"

[dev-dependencies]
rescyo-io = { workspace = true, features = ["testing"] }
rescyo-testkit = { workspace = true }
tempfile = "3.27.0"
