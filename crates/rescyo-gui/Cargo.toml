[package]
name = "rescyo-gui"
description = "Rescyo's desktop interface (Slint, software renderer), following docs/design."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
slint = { version = "1.18.1", default-features = false, features = [
  "std",
  "compat-1-2",
  "backend-winit",
  "renderer-software",
  "software-renderer-path",
  "accessibility",
] }

[build-dependencies]
rescyo-design = { workspace = true }
slint-build = "1.18.1"

[dev-dependencies]
png = "0.18.0"
