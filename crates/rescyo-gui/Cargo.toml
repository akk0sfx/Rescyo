[package]
name = "rescyo-gui"
description = "Rescyo's desktop interface (Slint, software renderer), following docs/design."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rescyo-core = { workspace = true }
rescyo-fs = { workspace = true }
rescyo-i18n = { workspace = true }
rescyo-io = { workspace = true }
slint = { version = "1.18.1", default-features = false, features = [
  "std",
  "compat-1-2",
  "backend-winit",
  "renderer-software",
  "software-renderer-path",
  "accessibility",
  "unstable-fontique-011",
  "unstable-winit-030",
  "raw-window-handle-06",
] }
raw-window-handle = "0.6.2"

[target.'cfg(target_os = "macos")'.dependencies]
slint = { version = "1.18.1", default-features = false, features = ["renderer-femtovg"] }
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry", "NSString", "NSUserDefaults"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "NSResponder",
  "NSView",
  "NSWindow",
  "NSVisualEffectView",
  "NSColor",
  "NSWorkspace",
  "NSGraphics",
  "NSAccessibility",
] }

[[bin]]
name = "rescyo-gui"
path = "src/main.rs"

[build-dependencies]
rescyo-design = { workspace = true }
slint-build = "1.18.1"

[dev-dependencies]
png = "0.18.0"
