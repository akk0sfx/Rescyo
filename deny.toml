[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # ttf-parser is unmaintained (no known vulnerability). It reaches us only through winit's
  # Wayland title-bar decorations (sctk-adwaita), which draw the window title with system fonts;
  # Rescyo's own text goes through Slint's renderer. Revisit when winit drops it.
  { id = "RUSTSEC-2026-0192", reason = "unmaintained, no vulnerability; only winit's Wayland decorations use it" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "GPL-3.0-or-later",
  # Slint (the GUI toolkit) is offered as "GPL-3.0-only OR its royalty-free and commercial
  # licences"; Rescyo takes the GPL-3.0 option (ADR-0006). That is compatible with
  # GPL-3.0-or-later, and makes the GUI binary itself GPL-3.0.
  "GPL-3.0-only",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
