name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  attribution:
    name: no co-author or AI attribution lines
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages and the PR description stay free of attribution trailers
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          pattern='^[[:space:]]*co-authored-by:|generated with \[?claude|noreply@anthropic\.com'
          bad=$(git log --format='%h %s%n%b' "$BASE..$HEAD" | grep -iE "$pattern" || true)
          if [ -n "$bad" ]; then
            echo "::error::Commits carry co-author or AI attribution lines (project rule):"
            git log --format='%h %s' -i -E --grep="$pattern" "$BASE..$HEAD"
            exit 1
          fi
          if printf '%s' "$BODY" | grep -iqE "$pattern"; then
            echo "::error::The pull request description carries an AI attribution line (project rule)."
            exit 1
          fi

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  host-safety:
    name: no host disk tools in scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Forbid disk-mutating host commands outside the corpus container
        run: |
          # Scripts that run on a developer's host must never touch block devices (ADR-0002).
          # Only corpus/container/ (executed inside Docker) and CI-only workflow steps may use them.
          pattern='\b(hdiutil|diskutil|losetup|mkfs(\.[a-z0-9]+)?|newfs_[a-z]+|mount|dd)\b'
          hits=$(git ls-files 'scripts/**' 'xtask/**' 'corpus/**' '*.sh' '*.ps1' \
                   | grep -v '^corpus/container/' \
                   | xargs -r grep -nE "$pattern" || true)
          if [ -n "$hits" ]; then echo "$hits"; exit 1; fi

  physical:
    # Disposable runners only: an image is attached read-only as a block device (ADR-0002).
    name: physical disk backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RESCYO_CI_DISPOSABLE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build test binary
        run: cargo test -p rescyo-io --test physical_ci --no-run --locked
      - name: Attach image (Linux)
        if: runner.os == 'Linux'
        run: |
          head -c 8388608 /dev/urandom > "$RUNNER_TEMP/disk.img"
          dev=$(sudo losetup --read-only --find --show "$RUNNER_TEMP/disk.img")
          sudo chmod a+r "$dev"
          echo "RESCYO_CI_DEVICE=$dev" >> "$GITHUB_ENV"
          echo "RESCYO_CI_IMAGE=$RUNNER_TEMP/disk.img" >> "$GITHUB_ENV"
      - name: Attach image (macOS)
        if: runner.os == 'macOS'
        run: |
          head -c 8388608 /dev/urandom > "$RUNNER_TEMP/disk.img"
          dev=$(hdiutil attach -readonly -nomount -imagekey diskimage-class=CRawDiskImage "$RUNNER_TEMP/disk.img" | head -1 | awk '{print $1}')
          raw="/dev/r${dev#/dev/}"
          sudo chmod a+r "$raw"
          echo "RESCYO_CI_DEVICE=$raw" >> "$GITHUB_ENV"
          echo "RESCYO_CI_IMAGE=$RUNNER_TEMP/disk.img" >> "$GITHUB_ENV"
      - name: Attach image (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vhd = Join-Path $env:RUNNER_TEMP 'disk.vhd'
          "create vdisk file=`"$vhd`" maximum=8 type=fixed" | Set-Content dp1.txt
          diskpart /s dp1.txt | Out-Null
          # A fixed VHD is raw sectors followed by a 512-byte footer: fill the data part.
          $bytes = New-Object byte[] 8388608
          [System.Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes)
          $fs = [System.IO.File]::OpenWrite($vhd); $fs.Write($bytes, 0, $bytes.Length); $fs.Close()
          [System.IO.File]::WriteAllBytes((Join-Path $env:RUNNER_TEMP 'disk.img'), $bytes)
          Mount-DiskImage -ImagePath $vhd -Access ReadOnly -NoDriveLetter | Out-Null
          $n = (Get-DiskImage -ImagePath $vhd | Get-Disk).Number
          "RESCYO_CI_DEVICE=\\.\PhysicalDrive$n" | Out-File -Append $env:GITHUB_ENV
          "RESCYO_CI_IMAGE=$(Join-Path $env:RUNNER_TEMP 'disk.img')" | Out-File -Append $env:GITHUB_ENV
      - name: Run physical test
        run: cargo test -p rescyo-io --test physical_ci --locked -- --nocapture

  corpus:
    # Builds the test corpus with the reference tools inside the corpus container (ADR-0002)
    # and runs every test that needs it. Cached by the hash of the generator and scenarios.
    name: corpus tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: corpus-cache
        with:
          path: corpus/out
          key: corpus-${{ hashFiles('corpus/container/**', 'corpus/scenarios/**') }}
      - name: Build corpus
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        run: cargo xtask corpus
      - name: Tests with corpus
        run: cargo test --workspace --locked
      - name: Gate 1 through the release binary
        run: cargo xtask gate1
